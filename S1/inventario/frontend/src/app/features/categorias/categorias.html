<div style="padding: 20px; font-family: sans-serif;">
  
  <!-- Cabecera -->
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Administración de Categorías</h2>
    <!-- Botón para regresar al inventario principal -->
    <button (click)="volver()" style="background-color: #6c757d; color: white; padding: 10px; border: none; cursor: pointer; border-radius: 5px;">
      Volver al Dashboard
    </button>
  </div>

  <p *ngIf="errorMessage" style="color: red; font-weight: bold;">{{ errorMessage }}</p>

  <!-- Formulario -->
  <div style="background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ddd;">
    <h3>{{ modoEdicion ? 'Editar Categoría' : 'Agregar Categoría' }}</h3>
    <div style="display: flex; gap: 10px; align-items: center;">
      
      <!-- Input para el nombre -->
      <input type="text" [(ngModel)]="nuevaCategoria.nombre" placeholder="Nombre de la categoría" style="padding: 8px; width: 300px;">
      
      <button (click)="guardar()" style="background-color: #28a745; color: white; padding: 8px 15px; border: none; border-radius: 3px; cursor: pointer;">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>

      <button *ngIf="modoEdicion" (click)="cancelarEdicion()" style="background-color: #6c757d; color: white; padding: 8px 15px; border: none; border-radius: 3px; cursor: pointer;">
        Cancelar
      </button>
    </div>
  </div>

  <!-- Tabla -->
  <table style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="background-color: #f4f4f4; border-bottom: 2px solid #ccc;">
        <th style="padding: 10px; text-align: left;">ID</th>
        <th style="padding: 10px; text-align: left;">Nombre</th>
        <th style="padding: 10px; text-align: center;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (categoria of categorias; track categoria.id) {
        <tr style="border-bottom: 1px solid #ddd;">
          <td style="padding: 10px;">{{ categoria.id }}</td>
          <td style="padding: 10px;">{{ categoria.nombre }}</td>
          <td style="padding: 10px; text-align: center;">
            <button (click)="editar(categoria)" style="background-color: #007bff; color: white; padding: 5px 10px; margin-right: 5px; border: none; border-radius: 3px; cursor: pointer;">
              Editar
            </button>
            <button (click)="eliminar(categoria.id)" style="background-color: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer;">
              Eliminar
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" style="padding: 20px; text-align: center; color: #666;">
            No hay categorías registradas...
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
