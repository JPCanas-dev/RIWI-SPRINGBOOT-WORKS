<div class="login-wrapper">
  <div class="login-card">
    
    <div class="login-header">
      <h2>📦 Mi Inventario</h2>
      <p>Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Muestra el mensaje de error si Spring Boot rechaza el acceso -->
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

    <!-- Formulario conectado a TypeScript -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="input-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" formControlName="username" placeholder="ej. admin">
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
        Iniciar Sesión
      </button>
      
    </form>
  </div>
</div>
