spring.application.name=inventario

# URL de conexión a la base de datos en memoria (la llamaremos 'testdbh2')
spring.datasource.url=jdbc:h2:mem:testdbh2
# Usuario por defecto que usa H2
spring.datasource.username=sa
spring.datasource.password=

# ¡Muy importante! Esto habilita una página web para que puedas ver y manipular tu base de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Esto hará que en la consola de IntelliJ veamos las consultas SQL que Spring hace por debajo
spring.jpa.show-sql=true
